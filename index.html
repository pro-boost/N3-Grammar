<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N3 Grammar Master — JLPT Study</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/kanji.css">
</head>
<body>

<header>
  <div class="logo" onclick="switchMode(currentMode, 'schedule')" style="cursor:pointer">
    <span class="logo-jp" id="logo-title">文法マスター</span>
    <span class="logo-en">JLPT N3</span>
  </div>
  <div class="mode-switch-header">
    <button class="ph-btn active" id="sw-grammar" onclick="switchMode('grammar')"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:5px"></span>Grammar</button>
    <button class="ph-btn" id="sw-kanji" onclick="switchMode('kanji')"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--teal);margin-right:5px"></span>Kanji & Vocab</button>
  </div>
  <div class="header-right">
    <div class="sync-status"><div class="sync-dot" id="sync-dot"></div><span id="sync-label">…</span></div>
    <span class="level-badge">N3</span>
  </div>
</header>

<div class="hero-strip" id="global-hero">
  <div class="hero-title"><span id="hero-sub">Weekly Schedule</span><span id="hero-main">学習計画</span></div>
  <div class="hero-stats" id="hero-stats">
    <div class="hstat"><span class="hstat-num" id="h-stat-1">0</span><span class="hstat-lbl" id="h-lbl-1">Mastered</span></div>
    <div class="hstat"><span class="hstat-num" id="h-stat-2">1</span><span class="hstat-lbl" id="h-lbl-2">Day</span></div>
  </div>
</div>

<div class="mode-tabs" id="global-mode-tabs">
  <div class="tab-scroll-wrap">
    <button class="mode-tab active" id="tab-schedule" onclick="showPage('schedule',this)">Dashboard</button>
    <button class="mode-tab" id="tab-lessons" onclick="showPage('lessons',this)">Lessons</button>
    <button class="mode-tab" id="tab-flashcards" onclick="showPage('flashcards',this)">Flashcards</button>
    <button class="mode-tab" id="tab-quiz" onclick="showPage('quiz',this)">Quiz</button>
    <button class="mode-tab" id="tab-game" onclick="showPage('game',this)">Game</button>
  </div>
  <div class="filter-select-wrap" id="global-filter-wrap">
    <button class="exam-entry-btn" id="tab-exam" onclick="showPage('exam',this)">Exam</button>
    <select id="global-filter-select" onchange="setGF(this.value)">
      <option value="all">All Items</option>
      <option value="today">Today</option>
      <option value="week">This Week</option>
      <option value="month">This Month</option>
      <option value="reached">Unlocked</option>
      <option value="srs_review">SRS Review</option>
    </select>
    <select id="type-filter-select" onchange="setTF(this.value)" style="display:none">
      <option value="all">All Types</option>
      <option value="kanji">Kanji Only</option>
      <option value="vocab">Vocab Only</option>
    </select>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- SCHEDULE -->
<div id="page-schedule" class="page active">
  <div class="page-body">
    <div class="section-label" style="margin-bottom:.9rem">Click any unlocked day to start that session</div>
    <div class="sched-grid" id="sched-grid"></div>
  </div>
</div>

<!-- LESSONS -->
<div id="page-lessons" class="page">
  <div class="page-body" id="lessons-body"></div>
</div>

<!-- FLASHCARDS -->
<div id="page-flashcards" class="page">
  <div class="page-body" id="fc-body"></div>
</div>

<!-- QUIZ -->
<div id="page-quiz" class="page">
  <div class="page-body" id="quiz-body"></div>
</div>

<!-- EXAM MODE -->
<div id="page-exam" class="page">
  <div class="page-body" id="exam-body"></div>
</div>

<!-- GAME -->
<div id="page-game" class="page">
  <div class="page-body" id="game-body"></div>
</div>

<script src="js/app.js"></script>
<script src="js/kanji.js"></script>
</body>
</html>
